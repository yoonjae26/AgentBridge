[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentbridge"
version = "0.1.0"
description = "Provider-agnostic orchestration framework for AI coding agents, with the AgentBench evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AgentBridge contributors" }]
keywords = ["ai", "agents", "orchestration", "claude-code", "benchmark", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<15",
    "pydantic>=2.7,<3",
    "SQLAlchemy>=2.0.30,<2.1",
    "PyYAML>=6.0.1,<7",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]
dev = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0",
]

[project.scripts]
agentbridge = "agentbridge.main:main"

[project.urls]
Homepage = "https://github.com/yoonjae26/AgentBridge"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbridge"]
artifacts = ["src/agentbridge/dashboard/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Third-party: starlette's TestClient asks for a different HTTP client package.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: tests that use git and subprocesses",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["benchmarks/tasks", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S603",  # subprocess without shell: we always pass argument lists and policy-check them
    "S607",  # partial executable paths are resolved with shutil.which
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"src/agentbridge/agents/capabilities.py" = ["S105"]
"src/agentbridge/validation/models.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
packages = ["agentbridge"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["agentbridge.storage.migrations.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
