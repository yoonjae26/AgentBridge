name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" -e packages/agentbridge-bench
      - run: ruff check src packages tests
      - run: ruff format --check src packages tests
      - run: mypy

  bench-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" -e packages/agentbridge-bench
      - name: AgentBench harness controls (no paid APIs)
        run: agentbridge-bench run smoke -c mock-oracle -c mock-noop --output /tmp/agentbench
