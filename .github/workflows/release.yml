name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build agentbridge-core and agentbridge-bench
        run: |
          python -m build --outdir dist .
          python -m build --wheel --outdir dist packages/agentbridge-bench  # wheel only: it bundles ../../benchmarks
      - name: Smoke-test both wheels in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/agentbridge --version
          cd /tmp && /tmp/clean/bin/agentbridge-bench list
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file CHANGELOG.md --verify-tag
      # Publishing to PyPI is intentionally not automated yet; configure PyPI trusted
      # publishing before adding a publish step.
