name: release

# Push a tag like v0.1.0 to build, smoke-test, publish to PyPI and create a GitHub release.
# PyPI publishing uses trusted publishing (OIDC): no PyPI password or token is stored
# anywhere. See docs/releasing.md for the one-time PyPI setup.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check that the tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in pyproject.toml packages/agentbridge-bench/pyproject.toml; do
            v=$(python -c "import tomllib,sys;print(tomllib.load(open(sys.argv[1],'rb'))['project']['version'])" "$f")
            [ "$v" = "$tag" ] || { echo "::error::$f has version $v but the tag is v$tag"; exit 1; }
          done
      - run: python -m pip install build
      - name: Build agentbridge-core and agentbridge-bench
        run: |
          python -m build --outdir dist/core .
          python -m build --wheel --outdir dist/bench packages/agentbridge-bench  # wheel only: it bundles ../../benchmarks
      - name: Smoke-test both wheels in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/core/*.whl dist/bench/*.whl
          /tmp/clean/bin/agentbridge --version
          cd /tmp && /tmp/clean/bin/agentbridge-bench list
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # PyPI allows one trusted-publisher configuration per project, so each package
  # publishes from its own environment.
  publish-core:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentbridge-core/
    permissions:
      id-token: write # trusted publishing; no secrets involved
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core/

  publish-bench:
    needs: publish-core # agentbridge-bench depends on agentbridge-core
    runs-on: ubuntu-latest
    environment:
      name: pypi-bench
      url: https://pypi.org/project/agentbridge-bench/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/bench/

  github-release:
    needs: publish-bench
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/core/* dist/bench/* --notes-file CHANGELOG.md --verify-tag
