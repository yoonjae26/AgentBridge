<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="AgentBridge: Agents propose. You approve.">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1B2945"/>
    </pattern>
  </defs>
  <rect width="1200" height="380" rx="18" fill="#0B1220"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#1E2C4A"/>

  <!-- mark -->
  <g transform="translate(72 62)">
    <rect x="22" y="26" width="12" height="104" rx="2" fill="#E8EDF7"/>
    <rect x="126" y="26" width="12" height="104" rx="2" fill="#E8EDF7"/>
    <path d="M28 30 Q80 112 132 30" fill="none" stroke="#E8EDF7" stroke-width="5" stroke-linecap="round"/>
    <path d="M28 30 Q4 70 0 112 M132 30 Q156 70 160 112" fill="none" stroke="#E8EDF7" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <rect x="0" y="112" width="160" height="8" rx="2" fill="#E8EDF7"/>
    <circle cx="80" cy="92" r="13" fill="#FFB000"/>
    <circle cx="80" cy="92" r="22" fill="none" stroke="#FFB000" stroke-width="2" opacity=".35"/>
  </g>

  <!-- wordmark -->
  <text x="262" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="58" font-weight="700" letter-spacing="5" fill="#E8EDF7">AGENT<tspan fill="#FFB000">BRIDGE</tspan></text>
  <text x="264" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#9AA7BD">Agents propose. <tspan fill="#E8EDF7" font-weight="600">You approve.</tspan></text>

  <text x="1128" y="58" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#5E6E8C">ORCHESTRATE · VERIFY · MEASURE</text>
  <rect x="1024" y="74" width="104" height="24" rx="12" fill="none" stroke="#FFB000"/>
  <text x="1076" y="91" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#FFB000">v0.1 ALPHA</text>

  <!-- signal track -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" text-anchor="middle">
    <line x1="120" y1="292" x2="1080" y2="292" stroke="#2A3A5C" stroke-width="3"/>
    <line x1="120" y1="292" x2="888" y2="292" stroke="#5E6E8C" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <g fill="#0B1220" stroke="#9AA7BD" stroke-width="3">
      <circle cx="120" cy="292" r="9"/><circle cx="312" cy="292" r="9"/><circle cx="504" cy="292" r="9"/><circle cx="696" cy="292" r="9"/>
    </g>
    <circle cx="888" cy="292" r="16" fill="#0B1220" stroke="#FFB000" stroke-width="3"/>
    <rect x="882" y="285" width="4" height="14" fill="#FFB000"/><rect x="890" y="285" width="4" height="14" fill="#FFB000"/>
    <circle cx="1080" cy="292" r="9" fill="#3DDC97"/>
    <g fill="#9AA7BD">
      <text x="120" y="330">PLAN</text><text x="312" y="330">ROUTE</text><text x="504" y="330">ISOLATE</text><text x="696" y="330">VERIFY</text>
    </g>
    <text x="888" y="330" fill="#FFB000" font-weight="700">YOU APPROVE</text>
    <text x="1080" y="330" fill="#3DDC97">MERGE</text>
  </g>
</svg>
