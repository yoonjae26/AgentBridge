[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentbridge-bench"
version = "0.1.0"
description = "AgentBench: reproducible evaluation of single- and multi-agent AI coding setups, built on AgentBridge."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "yoonjae26" }]
keywords = ["ai", "agents", "benchmark", "evaluation", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "agentbridge-core>=0.1.0,<0.2",
    "typer>=0.12,<1.0",
    "rich>=13.7,<15",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0.1,<7",
    "pytest>=8.2,<9",  # runs the hidden acceptance tests
]

[project.scripts]
agentbridge-bench = "agentbridge_bench.cli:main"

[project.urls]
Homepage = "https://github.com/yoonjae26/AgentBridge"
Documentation = "https://github.com/yoonjae26/AgentBridge/blob/main/docs/benchmark-methodology.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbridge_bench"]

# The benchmark suite (tasks, configurations, suites) ships inside the wheel so an
# installed agentbridge-bench works outside a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"../../benchmarks/tasks" = "agentbridge_bench/data/tasks"
"../../benchmarks/configurations.yaml" = "agentbridge_bench/data/configurations.yaml"
"../../benchmarks/suites.yaml" = "agentbridge_bench/data/suites.yaml"
