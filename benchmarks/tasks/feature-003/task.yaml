issue_description: |
  Implement parse_duration(text) in durations.py. It converts strings such as "1h30m", "45s", "2h5s" or "10m" into a number of seconds (int). Units h, m and s may each appear at most once and only in that order. Raise ValueError for anything else, including "", "abc", "1x", "30m1h", "-5m" and "1h 30m". format_duration() already exists and must keep working.
